<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>{{TITLE}}</title>
<style>
{{FONTS_CSS}}
{{STYLE}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div class="concept-strip" id="conceptStrip"></div>
<header class="bar">
  <div class="wrap">
    <div class="brand" id="brand"></div>
    <div class="pick" data-pick="who">
      <button class="pick-btn" type="button" aria-expanded="false" aria-haspopup="true" id="pickWho"><b class="empty"></b><i class="chev" aria-hidden="true"></i></button>
      <div class="menu" role="menu" aria-labelledby="pickWho" hidden></div>
    </div>
    <div class="pick" data-pick="eng">
      <button class="pick-btn" type="button" aria-expanded="false" aria-haspopup="true" id="pickEng"><b class="empty"></b><i class="chev" aria-hidden="true"></i></button>
      <div class="menu" role="menu" aria-labelledby="pickEng" hidden></div>
    </div>
  </div>
  <div class="readbar" id="readBar"></div>
</header>

<main id="main" tabindex="-1">
<div class="topnote" id="topNote"></div>
<section class="hero">
  <div class="wrap">
    <div class="hero-top">
      <div>
        <div class="label eyebrow" data-t="hero.eyebrow"></div>
        <h1 id="heroTitle"></h1>
        <p class="hero-lede" data-t="hero.lede"></p>
        <p class="hero-note" data-t="hero.note"></p>
      </div>
      <div class="core-feature">
        <div class="cover-lg" aria-hidden="true">
          <div class="brandline" id="coverBrand"></div>
          <h2 data-t="core.name"></h2>
          <div class="meta" id="coverMeta"></div>
        </div>
        <div class="core-actions">
          <button class="btn btn-orange" type="button" data-pdf="core" id="heroDownload"></button>
          <button class="btn btn-line" type="button" data-open-pack="core"><span data-btn="heroPreview">Preview</span></button>
          <small data-t="core.blurb"></small>
        </div>
      </div>
    </div>

    <div class="builder" id="builder">
      <div class="builder-head">
        <h2 data-t="builder.title"></h2>
        <p data-t="builder.intro"></p>
      </div>
      <div class="brow"><span class="label" id="lblWho" data-t="builder.whoLabel"></span><div class="chips" id="chipsWho" role="group" aria-labelledby="lblWho"></div></div>
      <div class="brow"><span class="label" id="lblEng" data-t="builder.engLabel"></span><div class="chips" id="chipsEng" role="group" aria-labelledby="lblEng"></div></div>
      <div class="builder-status" id="builderStatus" aria-live="polite"></div>
    </div>
  </div>
</section>

<section class="stats" id="stats" aria-label="Key figures">
  <div class="stats-pin">
    <div class="wrap">
      <div class="stats-top"><span class="label" data-t="stats.label"></span><span class="stat-count" id="statCount"></span></div>
      <div class="slides" id="slides"></div>
      <div class="stats-rail" id="statsRail" aria-hidden="true"></div>
    </div>
  </div>
</section>

<section class="story" id="story" aria-labelledby="storyHead">
  <div class="wrap">
    <div class="story-intro">
      <div class="sec-head">
        <h2 id="storyHead" data-t="story.title"></h2>
        <p data-t="story.intro"></p>
      </div>
      <div class="row"><button class="btn btn-black" type="button" data-pdf="core" id="storyDownload"></button><span id="storyMeta"></span></div>
    </div>
    <div id="chapters"></div>
  </div>
</section>

<section class="tl" id="tl" aria-labelledby="tlHead">
  <div class="tl-pin">
    <div class="wrap"><div class="sec-head"><h2 id="tlHead" data-t="timeline.title"></h2><p data-t="timeline.intro"></p></div></div>
    <div class="tl-track" id="tlTrack"></div>
  </div>
</section>

<section class="finale" id="pack" aria-labelledby="packHead">
  <div class="wrap">
    <div class="sec-head"><h2 id="packHead" data-t="finale.title"></h2><p id="finSub" data-t="finale.sub"></p></div>
    <div class="finale-grid">
      <div class="fan" id="fan" aria-hidden="true"></div>
      <div class="finale-side" aria-live="polite">
        <div class="fin-count"><b id="finDocs">1</b><span id="finPages"></span></div>
        <p class="fin-for" id="finFor"></p>
        <ol class="fin-list" id="finList"></ol>
        <div class="fin-more" id="finMore"></div>
        <div class="fin-btns">
          <button class="btn btn-orange" type="button" data-open-pack=""><span data-btn="packPreview">Preview pack</span> <span aria-hidden="true">→</span></button>
          <button class="btn btn-white" type="button" id="dlPack"></button>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="pi" id="pi" aria-labelledby="piHead">
  <div class="wrap">
    <div class="refs" id="refs"><h3 class="refs-h" data-t="references.title"></h3><ol class="refs-list" id="refsList"></ol></div>
    <div class="abbr" id="abbr"><h3 class="refs-h" data-t="abbreviations.title"></h3><p class="abbr-text" data-t="abbreviations.text"></p></div>
    <hr class="pi-rule" id="piRule">
    <h2 id="piHead" data-t="prescribing.title"></h2>
    <div class="pi-cta">
      <span class="pi-cta-t" data-t="prescribing.ctaText"></span>
      <span class="pi-cta-acts"><a href="#" class="pi-act" id="piView" data-nolink="1"><span data-t="prescribing.viewLabel"></span><svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10Z"/><circle cx="10" cy="10" r="2.4"/></svg></a><a href="#" class="pi-act" id="piDownload" data-nolink="1"><span data-t="prescribing.ctaLabel"></span><svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3v10m0 0-4-4m4 4 4-4M3.5 16.5h13"/></svg></a></span>
    </div>
    <div class="pi-box"><p data-t="prescribing.aeText"></p></div>
  </div>
</section>
</main>

<footer>
  <div class="wrap" id="footerInner"></div>
</footer>

<div class="dock away" id="dock">
  <div class="dock-stack" id="dockStack" aria-hidden="true"></div>
  <div class="dock-txt"><b id="dockCount">1 document</b><span id="dockPages"></span></div>
  <button class="btn btn-orange" type="button" data-goto="pack"><span data-btn="dockView">View pack</span></button>
</div>

<div class="pm" id="packModal" hidden>
  <div class="pm-shell" role="dialog" aria-modal="true" aria-labelledby="pmTitle">
    <header class="pm-bar">
      <div><div class="label" id="pmCount"></div><h2 id="pmTitle">Your pack</h2></div>
      <div class="pm-jumpwrap" id="pmJumpWrap"><button type="button" class="pm-arrow" data-jump-dir="-1" aria-label="Show earlier documents" hidden>&#8249;</button><nav class="pm-jump" id="pmJump" aria-label="Documents in this pack"></nav><button type="button" class="pm-arrow" data-jump-dir="1" aria-label="Show more documents" hidden>&#8250;</button></div>
      <div class="pm-actions"><button class="btn btn-line-dark pm-print" type="button" id="pmPrint"><span data-btn="print">Print</span></button><a href="#pi-view" class="pm-pi" id="pmPi" data-pi="view" data-t="prescribing.title"></a><button class="btn btn-orange" type="button" id="pmDownload"></button><button class="pm-close" type="button" id="pmClose" aria-label="Close pack viewer">✕</button></div>
    </header>
    <div class="pm-scroll" id="pmScroll">
      <p class="pm-note" id="pmNote" hidden></p>
      <div id="pmDocs" style="display: contents"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

{{LIBS}}
{{CONTENT}}
<script>
{{SCRIPT}}
</script>
</body>
</html>
